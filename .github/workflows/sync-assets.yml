name: Sync Asset Management from Notion

# ──────────────────────────────────────────────────────────────────────
#  아산시 강소형 스마트시티 — Notion → GitHub Pages 자동 동기화
#  v2.0 (2026-05-26) — 진단 강화 + 흔한 실패 원인 모두 대응
#
#  변경 사항:
#   ✅ pip install requests 단계 명시 (이전 누락이 exit code 1 원인)
#   ✅ NOTION_TOKEN secret 사전 검증 단계 추가
#   ✅ 파일 존재 여부 사전 점검
#   ✅ git push 권한 명시 (permissions: contents: write)
#   ✅ git pull --rebase 추가 (다른 워크플로우와 충돌 시 자동 머지)
# ──────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/30 * * * *'     # 30분마다
  workflow_dispatch:            # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths:
      - 'scripts/sync_notion.py'
      - '.github/workflows/sync-assets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ── 1. 리포 체크아웃 ─────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # git push 충돌 방지

      # ── 2. NOTION_TOKEN secret 사전 검증 ────────────────────────────
      - name: 🔐 Verify NOTION_TOKEN secret
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN secret이 설정되지 않았습니다!"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Name: NOTION_TOKEN / Value: ntn_..."
            exit 1
          fi
          echo "✅ NOTION_TOKEN secret 존재 확인 (${#NOTION_TOKEN} chars)"

      # ── 3. 파일 존재 여부 점검 ───────────────────────────────────────
      - name: 📋 Check required files
        run: |
          echo "=== 리포 루트 구조 ==="
          ls -la
          echo ""
          echo "=== scripts/ 디렉토리 ==="
          ls -la scripts/ || echo "❌ scripts/ 디렉토리 없음!"
          echo ""
          if [ ! -f "scripts/sync_notion.py" ]; then
            echo "::error::scripts/sync_notion.py 파일이 존재하지 않습니다!"
            exit 1
          fi
          echo "✅ scripts/sync_notion.py 존재 확인"

      # ── 4. Python 환경 ──────────────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 5. requests 라이브러리 설치 (가장 흔한 실패 원인 #1) ────────
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          echo ""
          echo "=== 설치 확인 ==="
          pip show requests | head -3

      # ── 6. Notion → JSON 동기화 ─────────────────────────────────────
      - name: 🔄 Sync Notion to assets.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: '2aa50aa9577d81ee9cd0e7e63b3fdf25'
          PYTHONUNBUFFERED: '1'        # 로그 즉시 출력
        run: python scripts/sync_notion.py

      # ── 7. 변경사항 확인 ────────────────────────────────────────────
      - name: 📊 Check changes
        id: changes
        run: |
          if [ -f "data/assets.json" ]; then
            echo "✅ data/assets.json 생성됨 ($(wc -c < data/assets.json) bytes)"
            if git diff --quiet data/assets.json 2>/dev/null; then
              echo "ℹ️  변경 없음 — commit 생략"
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "📝 변경사항 감지"
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "::error::data/assets.json이 생성되지 않았습니다!"
            exit 1
          fi

      # ── 8. 커밋 및 푸시 ─────────────────────────────────────────────
      - name: 💾 Commit & push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/assets.json
          git commit -m "🔄 자산관리 데이터 동기화 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          # 다른 워크플로우와 충돌 방지 (rebase pull)
          git pull --rebase origin main || true
          git push origin main
          echo "✅ 커밋 및 푸시 완료"
