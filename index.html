<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아산시 스마트시티 자산관리 대시보드</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090f;--card:rgba(255,255,255,.04);--card-b:rgba(255,255,255,.08);--t1:#f0f0f0;--t2:#a0a8b8;--t3:#606878;--accent:#00d4aa;--accent2:#00b8e6;--warn:#ffb800;--danger:#ff4757;--blue:#3b82f6;--purple:#8b5cf6;--glow:0 0 20px rgba(0,212,170,.15)}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{text-align:center;padding:32px 0 24px;position:relative}
header h1{font-size:clamp(18px,3vw,28px);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--t2);font-size:13px;margin-top:6px}
.sync-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.2);border-radius:20px;padding:4px 14px;font-size:11px;color:var(--accent);margin-top:10px}
.sync-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.kpi .label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi .value{font-size:clamp(22px,3vw,32px);font-weight:700;font-family:'JetBrains Mono','Pretendard',monospace}
.kpi .sub{font-size:11px;color:var(--t2);margin-top:4px}
.kpi.accent .value{color:var(--accent)}
.kpi.blue .value{color:var(--accent2)}
.kpi.warn .value{color:var(--warn)}
.kpi.purple .value{color:var(--purple)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:20px}
.panel h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 .icon{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px}
.bar-chart .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-chart .bar-label{width:100px;font-size:12px;color:var(--t2);text-align:right;flex-shrink:0}
.bar-chart .bar-track{flex:1;height:22px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden;position:relative}
.bar-chart .bar-fill{height:100%;border-radius:4px;transition:width .8s ease;display:flex;align-items:center;padding-left:8px;font-size:10px;color:var(--bg);font-weight:600}
.table-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--t3);font-weight:500;border-bottom:1px solid var(--card-b);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
tr:hover td{background:rgba(255,255,255,.02)}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.status-사용중{background:rgba(0,212,170,.15);color:var(--accent)}
.status-대기중{background:rgba(255,184,0,.15);color:var(--warn)}
.status-수리중{background:rgba(255,71,87,.15);color:var(--danger)}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
.loading{text-align:center;padding:60px;color:var(--t3)}
.loading .spinner{width:32px;height:32px;border:3px solid var(--card-b);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:24px;font-size:11px;color:var(--t3);margin-top:20px;border-top:1px solid var(--card-b)}
.donut-wrap{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.donut-item{text-align:center}
.donut-item .count{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
.donut-item .dlabel{font-size:11px;color:var(--t2);margin-top:2px}
.notion-link{display:inline-flex;align-items:center;gap:4px;background:rgba(0,184,230,.1);border:1px solid rgba(0,184,230,.2);border-radius:8px;padding:6px 14px;font-size:12px;color:var(--accent2);margin-bottom:16px;text-decoration:none}
.notion-link:hover{background:rgba(0,184,230,.2);text-decoration:none}
.pill{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;background:rgba(139,92,246,.15);color:var(--purple)}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>아산시 강소형 스마트시티</h1>
    <p>자산관리 통합 대시보드 v5.0</p>
    <a class="notion-link" href="https://www.notion.so/2aa50aa9577d81ee9cd0e7e63b3fdf25" target="_blank">Notion DB 열기 →</a>
    <div class="sync-badge"><span class="dot"></span> <span id="sync-time">동기화 중...</span></div>
    <p style="margin-top:8px;font-size:11px;color:var(--t3)">Slack #자산관리대장 → GAS → Notion DB → GitHub Pages</p>
  </header>

  <div id="app">
    <div class="loading"><div class="spinner"></div>데이터 로드 중...</div>
  </div>

  <div class="footer">
    <a href="https://www.notion.so/2aa50aa9577d81ee9cd0e7e63b3fdf25" target="_blank">Notion DB</a> |
    <a href="https://www.notion.so/2b750aa9577d8170b77ee4cab8d09d2f" target="_blank">전체 대시보드</a> |
    <a href="https://github.com/LEESUNGHO-AI/Asan-asset-management" target="_blank">GitHub</a>
    <br>© 2026 아산시 강소형 스마트시티 구축사업 | 제일엔지니어링 PMO | 관리자: Danny
  </div>
</div>

<script>
const COLORS = ['#00d4aa','#00b8e6','#ffb800','#8b5cf6','#ff4757','#3b82f6','#f472b6','#a78bfa'];
const WON = v => v >= 1e8 ? (v/1e8).toFixed(1)+'억' : v >= 1e4 ? (v/1e4).toFixed(0)+'만' : v.toLocaleString();

async function init() {
  try {
    const res = await fetch('data/assets.json');
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:var(--danger)">데이터 로드 실패: '+e.message+'<br><small>data/assets.json 파일을 확인하세요.</small></div>';
  }
}

function render(data) {
  const {meta, summary, assets} = data;
  const s = summary;

  document.getElementById('sync-time').textContent = meta.synced_at || '-';

  const activeCount = (s.by_status['사용중']||0);
  const waitCount = (s.by_status['대기중']||0);

  let html = '';

  // KPI
  html += '<div class="kpi-grid">';
  html += kpi('총 관리 자산', s.total_assets+'개', `사용중 ${activeCount} · 대기 ${waitCount}`, 'accent');
  html += kpi('총 자산가치', '₩'+WON(s.total_value), '취득가액 기준', 'blue');

  const catKeys = Object.keys(s.by_category||{});
  html += kpi('자산 분류', catKeys.length+'종', catKeys.join(', '), 'purple');

  const mgrKeys = Object.keys(s.by_manager||{}).filter(k=>k!=='미지정');
  html += kpi('관리 담당자', mgrKeys.length+'명', mgrKeys.join(', '), 'warn');
  html += '</div>';

  // Charts row
  html += '<div class="grid-2">';

  // 자산분류별
  html += '<div class="panel"><h3><span class="icon" style="background:rgba(0,212,170,.15)">📊</span>자산 분류별 현황</h3>';
  html += '<div class="bar-chart">';
  const catEntries = Object.entries(s.by_category||{}).sort((a,b)=>b[1]-a[1]);
  const maxCat = catEntries[0]?.[1]||1;
  catEntries.forEach(([k,v],i) => {
    const pct = (v/maxCat*100).toFixed(0);
    const val = (s.by_category_value||{})[k]||0;
    html += `<div class="bar-row"><span class="bar-label">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${COLORS[i%COLORS.length]}">${v}개</div></div><span style="font-size:11px;color:var(--t3);min-width:60px;text-align:right">₩${WON(val)}</span></div>`;
  });
  html += '</div></div>';

  // 담당자별
  html += '<div class="panel"><h3><span class="icon" style="background:rgba(139,92,246,.15)">👤</span>담당자별 자산 현황</h3>';
  html += '<div class="donut-wrap">';
  Object.entries(s.by_manager||{}).filter(([k])=>k!=='미지정').sort((a,b)=>b[1]-a[1]).forEach(([k,v],i) => {
    html += `<div class="donut-item"><div class="count" style="color:${COLORS[i%COLORS.length]}">${v}</div><div class="dlabel">${k}</div><div style="font-size:10px;color:var(--t3)">${(v/s.total_assets*100).toFixed(1)}%</div></div>`;
  });
  html += '</div></div>';
  html += '</div>';

  // 위치별
  html += '<div class="grid-2">';
  html += '<div class="panel"><h3><span class="icon" style="background:rgba(59,130,246,.15)">📍</span>설치 위치별</h3>';
  html += '<div class="bar-chart">';
  const locEntries = Object.entries(s.by_location||{}).sort((a,b)=>b[1]-a[1]);
  const maxLoc = locEntries[0]?.[1]||1;
  locEntries.forEach(([k,v],i) => {
    html += `<div class="bar-row"><span class="bar-label">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${(v/maxLoc*100).toFixed(0)}%;background:${COLORS[(i+2)%COLORS.length]}">${v}개</div></div></div>`;
  });
  html += '</div></div>';

  // 상태별
  html += '<div class="panel"><h3><span class="icon" style="background:rgba(255,184,0,.15)">⚡</span>자산 상태 현황</h3>';
  html += '<div class="donut-wrap" style="margin-top:12px">';
  Object.entries(s.by_status||{}).sort((a,b)=>b[1]-a[1]).forEach(([k,v],i) => {
    const c = k==='사용중'?'var(--accent)':k==='대기중'?'var(--warn)':k==='수리중'?'var(--danger)':'var(--t2)';
    html += `<div class="donut-item"><div class="count" style="color:${c}">${v}</div><div class="dlabel">${k}</div></div>`;
  });
  html += '</div></div>';
  html += '</div>';

  // Asset table
  html += '<div class="panel" style="margin-top:16px"><h3><span class="icon" style="background:rgba(0,184,230,.15)">📦</span>자산관리 마스터 DB (Notion 연동)</h3>';
  html += '<a class="notion-link" href="https://www.notion.so/2aa50aa9577d81ee9cd0e7e63b3fdf25" target="_blank" style="margin-bottom:8px">전체 보기 (Notion) →</a>';
  html += '<div class="table-wrap"><table><thead><tr>';
  html += '<th>코드</th><th>자산명</th><th>분류</th><th>담당자</th><th>상태</th><th>위치</th><th>금액</th>';
  html += '</tr></thead><tbody>';

  const sorted = [...assets].sort((a,b)=>(a.자산코드||999)-(b.자산코드||999));
  sorted.forEach(a => {
    const status = a.사용상태||'';
    html += `<tr onclick="window.open('${a.url}','_blank')" style="cursor:pointer">`;
    html += `<td style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3)">AS-${String(a.자산코드||'?').padStart(2,'0')}</td>`;
    html += `<td><strong>${a.자산명||'-'}</strong>${a.모델명?'<br><span style="font-size:10px;color:var(--t3)">'+a.모델명+'</span>':''}</td>`;
    html += `<td><span class="pill">${a.자산분류||'-'}</span></td>`;
    html += `<td style="font-size:11px">${a.관리담당자||'-'}</td>`;
    html += `<td><span class="status-badge status-${status}">${status||'-'}</span></td>`;
    html += `<td style="font-size:11px;color:var(--t2)">${a.설치위치||'-'}</td>`;
    html += `<td style="font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right">${a.구매금액?'₩'+a.구매금액.toLocaleString():'-'}</td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += `<p style="font-size:11px;color:var(--t3);margin-top:8px">전체 ${assets.length}개 · 행 클릭시 Notion 상세 페이지로 이동</p></div>`;

  document.getElementById('app').innerHTML = html;
}

function kpi(label, value, sub, cls) {
  return `<div class="kpi ${cls||''}"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||''}</div></div>`;
}

init();
</script>
</body>
</html>
